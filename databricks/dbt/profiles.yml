# databricks/dbt/profiles.yml
#
# dbt-databricks profile targeting the Azure Databricks SQL Warehouse.
#
# CHANGE vs local profiles.yml:
#   dev:  duckdb + delta_scan()   REMOVED
#   dev:  databricks SQL Warehouse (same endpoint as prod, cheaper serverless WH)
#   prod: databricks SQL Warehouse (dedicated)
#
# Auth: OAuth U2M, not a PAT. Run scripts/configure_auth.sh once (it wraps
#   databricks auth login --host <workspace> --profile DEFAULT
# which opens a browser and stores the OAuth/refresh token in ~/.databrickscfg).
# auth_type: databricks_cli below tells dbt-databricks to reuse that cached
# session instead of expecting a token/client secret in this file or in
# DATABRICKS_TOKEN. (Falls back to `auth_type: oauth` - which opens its own
# browser prompt each dbt session instead of reusing the CLI's - if your
# installed dbt-databricks version predates databricks_cli passthrough.)
# Still set DATABRICKS_HTTP_PATH from:
#   Databricks UI -> SQL Warehouses -> your_warehouse -> Connection Details

nyc_taxi_lakehouse:
  target: dev
  outputs:

    dev:
      type: databricks
      host:              "{{ env_var('DATABRICKS_HOST') }}"
      http_path:         "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type:         databricks_cli
      # Unity Catalog identifiers
      catalog:           "{{ env_var('UC_CATALOG', 'nyc_taxi') }}"
      schema:            dbt_dev
      threads:           4
      connect_timeout:   60
      connect_retries:   3

    prod:
      type: databricks
      host:              "{{ env_var('DATABRICKS_HOST') }}"
      http_path:         "{{ env_var('DATABRICKS_HTTP_PATH_PROD', env_var('DATABRICKS_HTTP_PATH')) }}"
      auth_type:         databricks_cli
      catalog:           "{{ env_var('UC_CATALOG', 'nyc_taxi') }}"
      schema:            marts
      threads:           8
      connect_timeout:   60
      connect_retries:   3
