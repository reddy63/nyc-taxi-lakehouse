
networks:
  lakehouse:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  spark_logs:

x-airflow-common: &airflow-common
  image: nyc-taxi-airflow:latest
  build:
    context: ./docker/airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'True'
    # S3/MinIO for Spark jobs
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_ENDPOINT_URL: http://minio:9000
    MINIO_ENDPOINT: http://minio:9000
    LANDING_BUCKET: ${LANDING_BUCKET}
    BRONZE_BUCKET: ${BRONZE_BUCKET}
    SILVER_BUCKET: ${SILVER_BUCKET}
    GOLD_BUCKET: ${GOLD_BUCKET}
    SPARK_MASTER: ${SPARK_MASTER}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./spark:/opt/airflow/spark
    - ./scripts:/opt/airflow/scripts
    - ./dbt:/opt/airflow/dbt
    - ./logs/airflow:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  networks:
    - lakehouse
  user: "${AIRFLOW_UID:-50000}:0"

services:

  # ─────────────────────────────────────────────────────────────────
  # MinIO  —  S3-compatible landing zone
  # ─────────────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: nyc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  # One-shot bucket initialiser
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: nyc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/nyc-taxi-landing;
        mc mb --ignore-existing local/nyc-taxi-bronze;
        mc mb --ignore-existing local/nyc-taxi-silver;
        mc mb --ignore-existing local/nyc-taxi-gold;
        mc mb --ignore-existing local/nyc-taxi-dbt;
        echo 'All buckets ready';
      "
    networks:
      - lakehouse

  # ─────────────────────────────────────────────────────────────────
  # Spark  —  master + worker (Delta Lake via delta-spark)
  # ─────────────────────────────────────────────────────────────────
  spark-master:
    image: nyc-taxi-spark:latest
    build:
      context: ./docker/spark
    container_name: nyc_spark_master
    hostname: spark-master
    # Official apache/spark image - no bitnami run.sh / SPARK_MODE env var. Invoke the
    # standalone Master class directly (runs in foreground, keeps the container alive).
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "7077:7077"   # Spark master
      - "8083:8080"   # Spark UI (remapped from 8080 - conflicts with banking-airflow-webserver)
    volumes:
      - ./spark:/opt/spark/jobs
      - spark_logs:/opt/spark/logs
    networks:
      - lakehouse

  spark-worker:
    image: nyc-taxi-spark:latest
    container_name: nyc_spark_worker
    # WorkerArguments reads SPARK_WORKER_CORES/SPARK_WORKER_MEMORY from the environment
    # directly (this is core Spark behavior, not bitnami-specific), so these still apply.
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--webui-port", "8081"]
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_EXECUTOR_MEMORY:-2g}
      SPARK_WORKER_CORES: "2"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8081:8081"   # Worker UI
    volumes:
      - ./spark:/opt/spark/jobs
    depends_on:
      - spark-master
    networks:
      - lakehouse

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL  —  Airflow metadata store
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "5433:5432"   # remapped from 5432 - a native (non-docker) postgres already owns host 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  # ─────────────────────────────────────────────────────────────────
  # Airflow  —  orchestrator
  # ─────────────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: nyc_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Arun --lastname Reddy \
          --role Admin --email arun@example.com
        airflow connections delete spark_default 2>/dev/null || true
        airflow connections add spark_default \
          --conn-type spark \
          --conn-host spark-master \
          --conn-port 7077
        echo "Airflow init complete"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: nyc_airflow_webserver
    command: webserver
    ports:
      - "8082:8080"   # Airflow UI
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: nyc_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
